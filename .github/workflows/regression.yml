name: Airspace Analytics regression
on:
  push:
    branches:
      - feature/aircraft-alerts-v1
  pull_request:
  workflow_dispatch:
jobs:
  all-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python3 -m compileall -q backend tests scripts
      - name: Compare full Python suite against unchanged main
        run: python3 scripts/check_regression.py
      - name: Require all tests to pass (including Alerts)
        run: python3 -m unittest discover -s tests -t . -q
      - name: Browser code syntax
        run: |
          node --check frontend/app.js
          node --check frontend/alerts-ui.js
          node --check frontend/tracker-ui.js
          node tests/test_tracker_ui.cjs
          node --check frontend/acars-ui.js
          node tests/test_acars_ui.cjs
          node --check frontend/live-terminal.js
          node tests/test_live_terminal_ui.cjs
          node --check frontend/calendar.js
          node --check frontend/flights-ui.js
          node tests/test_flights_ui.cjs
          node tests/test_traffic_month_ranking.cjs
          node tests/test_suggested_exclusions.cjs
          node tests/test_refinement_ui.cjs
      - name: Installation script syntax
        run: bash -n scripts/install.sh
      - name: Verify unchanged Traffic anchors
        run: |
          grep -q "function renderExplore()" frontend/app.js
          grep -q "function todayChartSeries(" frontend/app.js
          grep -q "function renderChart(" frontend/app.js
          grep -q "function fillPatterns(" frontend/app.js
